name: Construire l'APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ranger les fichiers
        run: |
          mkdir -p www/icons assets scripts
          mv_if() { if [ -f "$1" ]; then mv "$1" "$2"; else echo "Absent ou déjà rangé : $1"; fi; }
          for f in index.html pwa.js manifest-atelier.webmanifest; do mv_if "$f" www/; done
          for f in apple-touch-icon.png icon-192.png icon-512.png; do mv_if "$f" www/icons/; done
          for f in icon-only.png icon-foreground.png icon-background.png splash.png splash-dark.png; do mv_if "$f" assets/; done
          mv_if patch-android.sh scripts/
          test -f www/index.html || { echo "ERREUR : index.html est introuvable"; exit 1; }
          test -f scripts/patch-android.sh || { echo "ERREUR : patch-android.sh est introuvable"; exit 1; }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npm install @capacitor-community/contacts@^6.0.0 @capacitor/share@^6.0.0 @capacitor/filesystem@^6.0.0
      - run: npx cap add android
      - name: Plugin natif (impression)
        run: |
          D=android/app/src/main/java/ci/dressa/atelier
          mkdir -p "$D"
          cat > "$D/DressaNativePlugin.java" <<'EOF'
          package ci.dressa.atelier;

          import android.content.Context;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "DressaNative")
          public class DressaNativePlugin extends Plugin {
            private WebView printView;

            @PluginMethod
            public void print(final PluginCall call) {
              final String html = call.getString("html", "");
              final String name = call.getString("name", "Document");
              getActivity().runOnUiThread(() -> {
                printView = new WebView(getActivity());
                printView.setWebViewClient(new WebViewClient() {
                  @Override
                  public void onPageFinished(WebView view, String url) {
                    PrintManager pm = (PrintManager) getActivity().getSystemService(Context.PRINT_SERVICE);
                    PrintDocumentAdapter adapter = view.createPrintDocumentAdapter(name);
                    pm.print(name, adapter, new PrintAttributes.Builder().build());
                    call.resolve();
                  }
                });
                printView.loadDataWithBaseURL("https://localhost/", html, "text/html", "UTF-8", null);
              });
            }
          }
          EOF
          cat > "$D/MainActivity.java" <<'EOF'
          package ci.dressa.atelier;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(DressaNativePlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          EOF
      - run: bash scripts/patch-android.sh
      - name: Permissions micro et contacts
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for P in RECORD_AUDIO MODIFY_AUDIO_SETTINGS READ_CONTACTS WRITE_CONTACTS; do
            sed -i "s#<application#<uses-permission android:name=\"android.permission.$P\" />\n    <application#" "$M"
          done
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Dressa-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
